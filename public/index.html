<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06182e">
<title>Your Mix · Beats Scape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#f4fbff;
  --mute:rgba(214,236,248,.78);
  --line:rgba(120,210,240,.28);
  --accent:#5fd4ef;
  --cta:#e11d2e;
  --panel:rgba(4,18,36,.58);
  --shadow:0 18px 48px rgba(0,0,0,.45);
  --f-display:"Bebas Neue",Impact,sans-serif;
  --f-body:"Outfit",system-ui,sans-serif;
  --pad-x:clamp(16px, 4vw, 28px);
  --pad-y:max(16px, env(safe-area-inset-top));
  --pad-b:max(20px, env(safe-area-inset-bottom));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;min-height:100dvh;
  color:var(--ink);
  font:16px/1.45 var(--f-body);
  background-color:#06182e;
  background-image:url("/img/bgV3.png");
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
  background-attachment:scroll;
  display:flex;flex-direction:column;align-items:center;
  padding:var(--pad-y) var(--pad-x) var(--pad-b);
}
body::before{
  content:"";
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(180deg, rgba(3,12,28,.32) 0%, rgba(3,12,28,.58) 48%, rgba(3,12,28,.78) 100%);
}
.shell{
  position:relative;z-index:1;
  width:min(640px,100%);
  min-height:calc(100dvh - var(--pad-y) - var(--pad-b));
  display:flex;flex-direction:column;align-items:center;
  gap:clamp(12px, 2.5vh, 24px);
}
.brand{
  width:100%;
  display:flex;justify-content:center;
  flex:0 0 auto;
  padding-top:clamp(4px, 1.5vh, 12px);
}
.brand img{
  display:block;
  width:min(200px, 42vw);
  max-width:100%;
  height:auto;
  filter:drop-shadow(0 8px 20px rgba(0,0,0,.5));
}
.stage{
  flex:1 1 auto;
  width:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;
  gap:clamp(10px, 1.8vh, 16px);
  min-height:0;
}
.eyebrow{
  margin:0;
  font-size:clamp(11px, 2.8vw, 12px);font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);
}
h1{
  margin:0;
  font-family:var(--f-display);
  font-weight:400;
  font-size:clamp(34px, 9.5vw, 68px);
  line-height:.94;
  letter-spacing:.02em;
  text-wrap:balance;
  text-shadow:0 4px 24px rgba(0,0,0,.55);
  max-width:16ch;
}
.support{
  margin:0;
  max-width:36ch;
  color:var(--mute);
  font-size:clamp(14px, 3.6vw, 17px);
  font-weight:400;
  padding-inline:4px;
}
.player-wrap{
  width:100%;
  margin-top:4px;
  border:1px solid var(--line);
  background:var(--panel);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  box-shadow:var(--shadow);
  overflow:hidden;
}
video{
  display:block;width:100%;max-height:min(42vh, 360px);aspect-ratio:16/9;object-fit:contain;background:#000;
}
.actions{
  display:flex;flex-wrap:wrap;gap:12px;justify-content:center;
  margin-top:4px;width:100%;
}
.btn{
  appearance:none;border:0;cursor:pointer;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;
  min-height:52px;min-width:min(100%, 220px);padding:0 24px;
  width:min(100%, 320px);
  font-family:var(--f-display);font-size:clamp(20px, 5vw, 24px);letter-spacing:.06em;
  color:#fff;background:var(--cta);
  box-shadow:0 10px 28px rgba(225,29,46,.35);
  transition:transform .2s ease, filter .2s ease, background .2s ease;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn:active{transform:translateY(0)}
.btn[disabled],.btn.waiting{
  background:rgba(255,255,255,.12);
  color:var(--mute);
  box-shadow:none;
  cursor:default;pointer-events:none;
}
.foot{
  width:100%;
  margin-top:auto;
  padding-top:clamp(8px, 2vh, 18px);
  display:flex;flex-direction:column;align-items:center;gap:12px;
  text-align:center;
  flex:0 0 auto;
}
.iqos{
  width:100%;
  margin:0;
  padding:clamp(18px, 3.5vw, 26px) clamp(16px, 4vw, 24px);
  border:1px solid rgba(95,212,239,.38);
  background:linear-gradient(180deg, rgba(8,36,58,.78), rgba(4,18,36,.84));
  box-shadow:0 16px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
  display:flex;flex-direction:column;align-items:center;gap:clamp(8px, 1.5vh, 12px);
}
.iqos-kicker{
  margin:0;
  font-size:clamp(10px, 2.6vw, 12px);font-weight:600;letter-spacing:.22em;text-transform:uppercase;
  color:var(--accent);
}
.iqos-link{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:48px;
  font-family:var(--f-display);
  font-size:clamp(36px, 11vw, 56px);
  line-height:.95;
  letter-spacing:.04em;
  color:#fff;
  text-decoration:none;
  text-shadow:0 0 28px rgba(95,212,239,.45);
  border-bottom:3px solid var(--accent);
  padding:4px 2px 6px;
  transition:color .2s ease, border-color .2s ease, text-shadow .2s ease;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.iqos-link:hover,.iqos-link:focus-visible{
  color:var(--accent);
  border-color:#fff;
  text-shadow:0 0 36px rgba(95,212,239,.7);
  outline:none;
}
.iqos-cta{
  margin:0;
  max-width:28ch;
  color:#fff;
  font-size:clamp(15px, 3.8vw, 18px);
  font-weight:600;
  line-height:1.35;
}
.iqos-cta a{
  color:var(--accent);
  text-decoration:underline;
  text-underline-offset:3px;
  font-weight:700;
}
.iqos-cta a:hover,.iqos-cta a:focus-visible{color:#fff}
.iqos-note{
  margin:0;
  max-width:32ch;
  color:var(--mute);
  font-size:clamp(13px, 3.2vw, 15px);font-weight:500;line-height:1.4;
}
.legal{
  margin:0;
  font-size:11px;
  letter-spacing:.04em;
  color:rgba(214,236,248,.4);
}

/* Phones in landscape — keep content reachable without huge empty space */
@media (orientation:landscape) and (max-height:520px){
  .shell{min-height:auto;gap:10px}
  .brand img{width:min(150px, 28vw)}
  .stage{justify-content:flex-start;padding-top:4px}
  h1{font-size:clamp(28px, 7vw, 40px)}
  video{max-height:38vh}
  .iqos{padding:14px 16px;gap:6px}
  .iqos-link{font-size:clamp(28px, 7vw, 40px)}
}

/* Larger phones / tablets */
@media (min-width:600px){
  .brand img{width:min(230px, 36vw)}
  .btn{width:auto;min-width:240px}
}

/* Desktop */
@media (min-width:900px){
  body{background-attachment:fixed}
  .shell{width:min(680px,100%);gap:22px}
  .brand img{width:240px}
  video{max-height:380px}
  .iqos{padding:28px 32px}
}

@media (prefers-reduced-motion:reduce){
  .btn,.iqos-link{transition:none}
}
</style>
</head>
<body>
<div class="shell">
  <header class="brand">
    <img src="/img/LOGO_CuriousBeatsXDWP.png" alt="Curious Beats × DWP 2026 Jakarta" width="840" height="240">
  </header>

  <main class="stage">
    <p class="eyebrow" id="eyebrow">Beats Scape</p>
    <h1 id="title">Loading your mix…</h1>
    <p class="support" id="support">Keep your printout. This page opens your take from the QR.</p>

    <div class="player-wrap" id="playerWrap" hidden>
      <video id="player" controls playsinline playsInline webkit-playsinline></video>
    </div>

    <div class="actions">
      <a class="btn waiting" id="dl" hidden>Download mix</a>
      <button class="btn waiting" id="dlWait" type="button" disabled>Waiting for video…</button>
    </div>
  </main>

  <footer class="foot">
    <div class="iqos">
      <p class="iqos-kicker">Presented with</p>
      <a class="iqos-link" href="https://www.iqos.com/" target="_blank" rel="noopener noreferrer">IQOS.com</a>
      <p class="iqos-cta">
        <a href="https://www.iqos.com/" target="_blank" rel="noopener noreferrer">Click here to know more about IQOS</a>
      </p>
      <p class="iqos-note">Step beyond the mix — explore what’s next with IQOS.</p>
    </div>
    <p class="legal">Beats Without Limits · Stay Curious</p>
  </footer>
</div>

<script>
const id = new URLSearchParams(location.search).get('id') || '';
const title = document.getElementById('title');
const support = document.getElementById('support');
const eyebrow = document.getElementById('eyebrow');
const dl = document.getElementById('dl');
const wait = document.getElementById('dlWait');
const player = document.getElementById('player');
const playerWrap = document.getElementById('playerWrap');
const ID_RE = /^[a-z0-9]+(?:-[a-z0-9]+)*_[0-9]{1,16}$/;
let pollTimer = 0;

function showPending(track){
  title.textContent = (track && track.name) || 'Getting your mix ready…';
  support.textContent = 'Please wait while we turn your mix into art. This page refreshes on its own.';
  eyebrow.textContent = (track && track.genreName) || 'Beats Scape';
  wait.hidden = false;
  wait.textContent = 'Waiting for video…';
  dl.hidden = true;
  playerWrap.hidden = true;
}

function showReady(track){
  title.textContent = track.name || 'Your mix';
  const when = track.ts ? new Date(track.ts).toLocaleString('en-GB', { dateStyle:'medium', timeStyle:'short' }) : '';
  support.textContent = [track.genreName, when].filter(Boolean).join(' · ') || 'Ready to play and download.';
  eyebrow.textContent = 'Your mix';
  document.title = (track.name || 'Mix') + ' · Beats Scape';
  player.src = track.url;
  playerWrap.hidden = false;
  dl.href = track.url;
  dl.setAttribute('download', (track.id || 'mix') + '.mp4');
  dl.hidden = false;
  dl.classList.remove('waiting');
  dl.textContent = 'Download mix';
  wait.hidden = true;
}

function showError(msg){
  title.textContent = 'Could not load mix';
  support.textContent = msg || 'Try opening this page again from your receipt QR.';
  wait.hidden = true;
  dl.hidden = true;
  playerWrap.hidden = true;
}

async function loadOnce(){
  const r = await fetch('/api/track?id=' + encodeURIComponent(id));
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
  return data;
}

async function tick(){
  try {
    const track = await loadOnce();
    if (track.status === 'ready' && track.url) {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = 0; }
      showReady(track);
      return;
    }
    showPending(track);
  } catch (e) {
    showError(e.message || 'Could not reach the download server.');
  }
}

if (!ID_RE.test(id)){
  title.textContent = 'Missing mix link';
  support.textContent = 'This page needs a receipt id from your QR.';
  wait.hidden = true;
} else {
  tick();
  pollTimer = setInterval(tick, 4000);
}
</script>
</body>
</html>
