<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06182e">
<title>Your Mix · Beats Scape</title>
<style>
@font-face{
  font-family:"Breathing IQOS";
  src:url("/fonts/BreathingIQOS-Regular.otf") format("opentype");
  font-weight:400; font-style:normal; font-display:swap;
}
@font-face{
  font-family:"Breathing IQOS";
  src:url("/fonts/BreathingIQOS-Bold.otf") format("opentype");
  font-weight:700; font-style:normal; font-display:swap;
}
@font-face{
  font-family:"IQOS";
  src:url("/fonts/IQOS-Bold.otf") format("opentype");
  font-weight:700; font-style:normal; font-display:swap;
}
@font-face{
  font-family:"IQOS Sans";
  src:url("/fonts/IQOSSans-Regular.otf") format("opentype");
  font-weight:400; font-style:normal; font-display:swap;
}
:root{
  --ink:#f4fbff;
  --mute:rgba(214,236,248,.72);
  --line:rgba(120,210,240,.28);
  --accent:#02AABE;
  --cta:#02AABE;
  --ink-btn:#001823;
  --panel:rgba(4,18,36,.55);
  --shadow:0 18px 48px rgba(0,0,0,.45);
  --f-brand:"Breathing IQOS", "IQOS", system-ui, sans-serif;
  --f-display:"IQOS", "IQOS Sans", system-ui, sans-serif;
  --f-body:"IQOS Sans", "IQOS", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;
  color:var(--ink);
  font:16px/1.45 var(--f-body);
  background:#06182e url("/img/bgV3.png") center / cover no-repeat fixed;
  display:flex;flex-direction:column;align-items:center;
  padding:max(20px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
}
body::before{
  content:"";
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    linear-gradient(180deg, rgba(3,12,28,.35) 0%, rgba(3,12,28,.55) 45%, rgba(3,12,28,.72) 100%);
}
.shell{
  position:relative;z-index:1;
  width:min(560px,100%);
  min-height:min(100vh, 920px);
  display:flex;flex-direction:column;align-items:center;
  gap:0;
}
.brand{
  width:100%;
  display:flex;flex-direction:column;align-items:center;
  padding-top:clamp(10px, 3vh, 24px);
  flex:0 0 auto;
}
.brand .wordmark{
  margin:0;
  font-family:"Breathing IQOS", cursive;
  font-weight:700;
  font-size:clamp(40px, 10vw, 64px);
  line-height:.92;
  letter-spacing:-.02em;
  color:#f4fcfd;
  text-shadow:0 4px 24px rgba(0,0,0,.55);
}
.brand .wordmark span{color:var(--accent)}
.stage{
  flex:1;
  width:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;
  gap:14px;
  padding:28px 0 20px;
}
.eyebrow{
  margin:0;
  font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);
}
h1{
  margin:0;
  font-family:var(--f-display);
  font-weight:400;
  font-size:clamp(42px, 11vw, 72px);
  line-height:.92;
  letter-spacing:.02em;
  text-wrap:balance;
  text-shadow:0 4px 24px rgba(0,0,0,.55);
}
.support{
  margin:0;
  max-width:34ch;
  color:var(--mute);
  font-size:clamp(15px, 2.4vw, 17px);
  font-weight:400;
}
.player-wrap{
  width:100%;
  margin-top:8px;
  border:1px solid var(--line);
  background:var(--panel);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  box-shadow:var(--shadow);
  overflow:hidden;
}
video{
  display:block;width:100%;aspect-ratio:16/9;background:#000;vertical-align:middle;
}
.actions{
  display:flex;flex-wrap:wrap;gap:12px;justify-content:center;
  margin-top:6px;width:100%;
}
.btn{
  appearance:none;border:0;cursor:pointer;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;
  min-height:54px;padding:0 28px;
  font-family:var(--f-display);font-size:22px;letter-spacing:.06em;
  color:var(--ink-btn);background:var(--cta);
  box-shadow:0 10px 28px rgba(2,170,190,.4);
  transition:transform .2s ease, filter .2s ease, background .2s ease;
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn:active{transform:translateY(0)}
.btn[disabled],.btn.waiting{
  background:rgba(255,255,255,.12);
  color:var(--mute);
  box-shadow:none;
  cursor:default;pointer-events:none;
}
.btn.ghost{
  background:transparent;
  border:1px solid var(--line);
  color:var(--ink);
  box-shadow:none;
}
.foot{
  width:100%;
  margin-top:auto;
  padding-top:32px;
  display:flex;flex-direction:column;align-items:center;gap:16px;
  text-align:center;
}
.iqos{
  width:100%;
  margin:0;
  padding:22px 20px 24px;
  border:1px solid rgba(95,212,239,.35);
  background:linear-gradient(180deg, rgba(8,36,58,.72), rgba(4,18,36,.78));
  box-shadow:0 16px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.iqos-kicker{
  margin:0;
  font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
  color:var(--accent);
}
.iqos-link{
  display:inline-block;
  font-family:var(--f-display);
  font-size:clamp(40px, 10vw, 56px);
  line-height:.95;
  letter-spacing:.04em;
  color:#fff;
  text-decoration:none;
  text-shadow:0 0 28px rgba(95,212,239,.45);
  border-bottom:3px solid var(--accent);
  padding-bottom:2px;
  transition:color .2s ease, border-color .2s ease, text-shadow .2s ease;
}
.iqos-link:hover{
  color:var(--accent);
  border-color:#fff;
  text-shadow:0 0 36px rgba(95,212,239,.7);
}
.iqos-note{
  margin:0;
  max-width:28ch;
  color:var(--mute);
  font-size:15px;font-weight:500;line-height:1.4;
}
.legal{
  margin:0;
  font-size:11px;
  letter-spacing:.04em;
  color:rgba(214,236,248,.4);
}
@media (prefers-reduced-motion:reduce){
  .btn,.iqos-link{transition:none}
}
</style>
</head>
<body>
<div class="shell">
  <header class="brand">
    <p class="wordmark" aria-label="BeatsScape">Beats<span>Scape</span></p>
  </header>

  <main class="stage">
    <p class="eyebrow" id="eyebrow">Beats Scape</p>
    <h1 id="title">Loading your mix…</h1>
    <p class="support" id="support">Keep your printout. This page opens your take from the QR.</p>

    <div class="player-wrap" id="playerWrap" hidden>
      <video id="player" controls playsinline></video>
    </div>

    <div class="actions">
      <a class="btn waiting" id="dl" hidden>Download mix</a>
      <button class="btn waiting" id="dlWait" type="button" disabled>Waiting for video…</button>
    </div>
  </main>

  <footer class="foot">
    <div class="iqos">
      <p class="iqos-kicker">Presented with</p>
      <a class="iqos-link" href="https://www.iqos.com/" target="_blank" rel="noopener noreferrer">IQOS.com</a>
      <p class="iqos-note">Step beyond the mix — explore what’s next with IQOS.</p>
    </div>
    <p class="legal">Beats Without Limits · Stay Curious</p>
  </footer>
</div>

<script>
const id = new URLSearchParams(location.search).get('id') || '';
const title = document.getElementById('title');
const support = document.getElementById('support');
const eyebrow = document.getElementById('eyebrow');
const dl = document.getElementById('dl');
const wait = document.getElementById('dlWait');
const player = document.getElementById('player');
const playerWrap = document.getElementById('playerWrap');
const ID_RE = /^[a-z0-9]+(?:-[a-z0-9]+)*_[0-9]{1,16}$/;
let pollTimer = 0;

function showPending(track){
  title.textContent = (track && track.name) || 'Getting your mix ready…';
  support.textContent = 'Please wait while we turn your mix into art. This page refreshes on its own.';
  eyebrow.textContent = (track && track.genreName) || 'Beats Scape';
  wait.hidden = false;
  wait.textContent = 'Waiting for video…';
  dl.hidden = true;
  playerWrap.hidden = true;
}

function showReady(track){
  title.textContent = track.name || 'Your mix';
  const when = track.ts ? new Date(track.ts).toLocaleString('en-GB', { dateStyle:'medium', timeStyle:'short' }) : '';
  support.textContent = [track.genreName, when].filter(Boolean).join(' · ') || 'Ready to play and download.';
  eyebrow.textContent = 'Your mix';
  document.title = (track.name || 'Mix') + ' · Beats Scape';
  player.src = track.url;
  playerWrap.hidden = false;
  dl.href = track.url;
  dl.setAttribute('download', (track.id || 'mix') + '.mp4');
  dl.hidden = false;
  dl.classList.remove('waiting');
  dl.textContent = 'Download mix';
  wait.hidden = true;
}

function showError(msg){
  title.textContent = 'Could not load mix';
  support.textContent = msg || 'Try opening this page again from your receipt QR.';
  wait.hidden = true;
  dl.hidden = true;
  playerWrap.hidden = true;
}

async function loadOnce(){
  const r = await fetch('/api/track?id=' + encodeURIComponent(id));
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
  return data;
}

async function tick(){
  try {
    const track = await loadOnce();
    if (track.status === 'ready' && track.url) {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = 0; }
      showReady(track);
      return;
    }
    showPending(track);
  } catch (e) {
    showError(e.message || 'Could not reach the download server.');
  }
}

if (!ID_RE.test(id)){
  title.textContent = 'Missing mix link';
  support.textContent = 'This page needs a receipt id from your QR.';
  wait.hidden = true;
} else {
  tick();
  pollTimer = setInterval(tick, 4000);
}
</script>
</body>
</html>
